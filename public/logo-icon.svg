<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <title>Job-Lens AI Icon</title>
  <!-- Blue rounded square -->
  <rect x="0" y="0" width="200" height="200" rx="44" fill="#2563C8"/>
  <!-- Magnifier outer ring -->
  <circle cx="95" cy="90" r="52" fill="none" stroke="white" stroke-width="12"/>
  <!-- Lens fill -->
  <circle cx="95" cy="90" r="40" fill="#1E52A8" opacity="0.5"/>
  <!-- Target ring 1 -->
  <circle cx="95" cy="90" r="30" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="3"/>
  <!-- Target ring 2 -->
  <circle cx="95" cy="90" r="15" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="3"/>
  <!-- Center dot -->
  <circle cx="95" cy="90" r="7" fill="white"/>
  <!-- Crosshairs -->
  <line x1="95" y1="55" x2="95" y2="65" stroke="rgba(255,255,255,0.5)" stroke-width="3" stroke-linecap="round"/>
  <line x1="95" y1="115" x2="95" y2="125" stroke="rgba(255,255,255,0.5)" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="90" x2="70" y2="90" stroke="rgba(255,255,255,0.5)" stroke-width="3" stroke-linecap="round"/>
  <line x1="120" y1="90" x2="130" y2="90" stroke="rgba(255,255,255,0.5)" stroke-width="3" stroke-linecap="round"/>
  <!-- Handle -->
  <line x1="135" y1="128" x2="163" y2="156" stroke="white" stroke-width="12" stroke-linecap="round"/>
  <!-- Handle end dot -->
  <circle cx="168" cy="161" r="12" fill="white"/>
  <circle cx="168" cy="161" r="6" fill="#2563C8"/>
</svg>
